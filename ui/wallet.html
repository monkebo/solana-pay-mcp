<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#ffffff; --fg:#15201c; --muted:#5c6b64; --line:#d9ded9; --accent:#0f8a5f; --accent-fg:#ffffff; --soft:#eef6f2; --bad:#b42318; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16201b; --fg:#e8ece8; --muted:#9aa8a0; --line:#2a3530; --accent:#3dcf96; --accent-fg:#0b1410; --soft:#1c2b24; --bad:#f97066; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#16201b; --fg:#e8ece8; --muted:#9aa8a0; --line:#2a3530; --accent:#3dcf96; --accent-fg:#0b1410; --soft:#1c2b24; --bad:#f97066; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
.card { padding:16px; display:flex; flex-direction:column; gap:12px; }
.top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
.label { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.amount { font:600 30px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; }
.amount small { font-size:16px; color:var(--muted); margin-left:4px; }
.pill { font:600 11px ui-monospace,Menlo,monospace; padding:3px 8px; border-radius:99px; background:var(--soft); color:var(--accent); }
.pill.bad { color:var(--bad); }
dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; }
dt { color:var(--muted); }
dd { margin:0; min-width:0; overflow-wrap:anywhere; }
.mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
td { padding:6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
td.r { text-align:right; font-family:ui-monospace,Menlo,monospace; white-space:nowrap; padding-left:12px; }
.actions { display:flex; gap:8px; flex-wrap:wrap; }
button { font:600 14px system-ui,sans-serif; border-radius:8px; padding:10px 16px; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--fg); }
button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
button:disabled { opacity:.5; cursor:default; }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
a { color:var(--accent); }
.qr { width:180px; max-width:100%; background:#fff; padding:8px; border-radius:8px; }
.qr svg { display:block; width:100%; height:auto; }
.err { color:var(--bad); }
.muted { color:var(--muted); }
</style>
</head>
<body>
<div id="root" class="card"><span class="muted">Loading…</span></div>
<script type="module">
/*__APP_BUNDLE__*/
const App = globalThis.__McpExtApp;
const root = document.getElementById("root");
const app = new App({ name: "solana-pay", version: "0.4.0" });

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const short = (a) => (a && a.length > 12 ? a.slice(0, 4) + "…" + a.slice(-4) : a);
const link = (url, text) => `<a href="${esc(url)}" data-link>${esc(text)}</a>`;

function render(sc) {
  if (!sc || !sc.view) { root.innerHTML = `<span class="muted">No data.</span>`; return; }
  const v = sc.view;
  const pending = sc.status === "PENDING_CONFIRMATION";
  if (v === "send") {
    const preview = sc.wouldRequireConfirmation !== undefined && !sc.status; // dryRun result
    const label = pending ? "Waiting for owner approval" : preview ? "Confirm payment" : sc.payUrl ? "Scan to pay from your wallet" : "Sent";
    const pill = pending ? "PENDING" : preview ? "PREVIEW" : esc(sc.status || "SENT");
    root.innerHTML = `
      <div class="top"><span class="label">${label}${sc.backend ? " · via " + esc(sc.backend) : ""}</span><span class="pill ${pending ? "bad" : ""}">${pill}</span></div>
      <div class="amount">${esc(sc.amount)}<small>${esc(sc.token)}</small></div>
      <dl>
        <dt>To</dt><dd><b>${esc(sc.recipientLabel || "")}</b> <span class="mono">${esc(sc.recipient)}</span></dd>
        ${sc.memo ? `<dt>For</dt><dd>${esc(sc.memo)}</dd>` : ""}
        <dt>Value</dt><dd>$${esc(sc.amountUsd)}</dd>
        ${sc.estimatedNetworkFeeSol ? `<dt>Fee</dt><dd>~${esc(sc.estimatedNetworkFeeSol)} SOL</dd>` : ""}
        ${sc.reasons && sc.reasons.length ? `<dt>Flags</dt><dd class="err">${esc(sc.reasons.join("; "))}</dd>` : ""}
      </dl>
      ${sc.qrSvg ? `<div class="qr">${sc.qrSvg}</div>` : ""}
      <div class="actions">
        ${preview ? `<button class="primary" id="go">Pay ${esc(sc.amount)} ${esc(sc.token)}</button>` : ""}
        ${pending ? `<button class="primary" id="approve">Approve</button><button id="reject">Reject</button>` : ""}
        ${sc.explorer ? link(sc.explorer, "View on Solana Explorer") : ""}
        ${sc.payUrl ? `<button id="copy">Copy pay link</button>` : ""}
      </div>
      <div id="msg">${pending ? `<span class="muted">${esc(sc.message || "")}</span>` : ""}</div>`;
    const go = document.getElementById("go");
    if (go) go.onclick = () => rerun("wallet_send", { amount: sc.amount, recipient: sc.recipientLabel || sc.recipient, tokenAddress: sc.tokenAddress, memo: sc.memo || undefined });
    wireApproval(sc.orderId);
    const c = document.getElementById("copy");
    if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(sc.payUrl); say("Copied."); } catch { say(sc.payUrl); } };
  } else if (v === "batch") {
    const rows = (sc.rows || []).map((r) => `<tr><td><b>${esc(r.to)}</b><br><span class="muted">${esc(r.memo || "")}</span>${r.status ? `<br>${r.txHash ? `<span class="pill">${esc(r.status)}</span>` : `<span class="${r.status === "FAILED" ? "err" : "muted"}">${esc(r.status)}${r.error ? ": " + esc(r.error) : ""}</span>`}` : ""}</td><td class="r">${esc(r.amount)}</td></tr>`).join("");
    const preview = (sc.rows || []).every((r) => r.status === "PREVIEW");
    root.innerHTML = `
      <div class="top"><span class="label">${preview ? "Confirm batch" : "Batch"} · ${esc(sc.of)} payments</span><span class="pill">${preview ? "PREVIEW" : esc(sc.completed) + "/" + esc(sc.of)}</span></div>
      <div class="amount">$${esc(sc.totalUsd)}</div>
      <table>${rows}</table>
      ${preview ? `<div class="actions"><button class="primary" id="go">Pay all</button></div>` : ""}
      <div id="msg"></div>`;
    const go = document.getElementById("go");
    if (go) go.onclick = () => rerun("wallet_pay_many", { payments: (sc.rows || []).map((r) => ({ to: r.to, amount: r.amount, memo: r.memo || undefined })) });
  } else if (v === "invoice") {
    root.innerHTML = `
      <div class="top"><span class="label">Invoice · ${esc(sc.cluster)}</span><span class="pill ${sc.paid ? "" : "bad"}">${esc(sc.status || (sc.paid ? "PAID" : "UNPAID"))}</span></div>
      <div class="amount">${esc(sc.amount)}<small>USDC</small></div>
      <dl><dt>For</dt><dd>${esc(sc.memo)}</dd><dt>Pay to</dt><dd class="mono">${esc(sc.recipient)}</dd><dt>Id</dt><dd class="mono">${esc(sc.id)}</dd>
      ${sc.paid ? `<dt>Paid</dt><dd>${esc(sc.paidAt)}${sc.payerLabel ? " by <b>" + esc(sc.payerLabel) + "</b>" : sc.payer ? " by <span class='mono'>" + esc(short(sc.payer)) + "</span>" : ""}${sc.confidence === "probable" ? " <span class='muted'>(matched by inflow)</span>" : ""}</dd>` : ""}</dl>
      ${sc.qrSvg && !sc.paid ? `<div class="qr">${sc.qrSvg}</div>` : ""}
      <div class="actions">${sc.paid ? link(sc.explorer, "View on Solana Explorer") : `<button id="copy">Copy pay link</button><button id="check">Check if paid</button>`}</div>
      <div id="msg"></div>`;
    const c = document.getElementById("copy");
    if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(sc.url); say("Copied."); } catch { say(sc.url); } };
    const ch = document.getElementById("check");
    if (ch) ch.onclick = async () => { const r = await call("invoice_status", { id: sc.id }); if (r?.structuredContent) render({ ...r.structuredContent, qrSvg: sc.qrSvg }); };
  } else if (v === "status") {
    const q = (used, left, limit) => `${esc(used)} used · ${esc(left)} left of $${esc(limit)}`;
    root.innerHTML = `
      <div class="top"><span class="label">Wallet · ${esc(sc.backend || sc.active?.kind || "")}</span><span class="pill ${sc.status === "CONNECTED" || sc.active?.connected ? "" : "bad"}">${esc(sc.status || (sc.active?.connected ? "CONNECTED" : "NOT READY"))}</span></div>
      <dl>
        ${sc.backendLabel || sc.active?.label ? `<dt>Backend</dt><dd>${esc(sc.backendLabel || sc.active.label)}</dd>` : ""}
        ${sc.detail || sc.active?.detail ? `<dt></dt><dd class="muted">${esc(sc.detail || sc.active.detail)}</dd>` : ""}
        ${sc.dailyLimit !== undefined ? `<dt>Daily</dt><dd>$${q(sc.quotaUsed, sc.quotaLeft, sc.dailyLimit)}</dd>
        <dt>x402</dt><dd>$${q(sc.x402QuotaUsed, sc.x402QuotaLeft, sc.x402DailyLimit)}</dd>
        <dt>Per payment</dt><dd>${sc.maxPayment === null ? "no cap" : "$" + esc(sc.maxPayment)}</dd>
        <dt>Recipients</dt><dd>${sc.addressBookOnly ? "address book only" : "any address (risky ones need approval)"}</dd>
        <dt>Risky tx</dt><dd>${esc(sc.abnormalTxnHandling)}</dd>
        <dt>Session ends</dt><dd>${esc(sc.sessionExpireTime || "-")}</dd>` : ""}
      </dl>`;
  } else if (v === "balance") {
    const rows = (sc.rows || []).map((r) => `<tr><td><b>${esc(r.symbol)}</b> <span class="mono muted">${esc(short(r.address))}</span></td><td class="r">${esc(r.balance)}</td><td class="r">${r.value === null ? "-" : "$" + esc(r.value)}</td></tr>`).join("");
    const total = (sc.rows || []).reduce((a, r) => a + Number(r.value || 0), 0);
    root.innerHTML = `<div class="top"><span class="label">Balances</span><span class="pill">$${total.toFixed(2)}</span></div><table>${rows || "<tr><td class='muted'>empty</td></tr>"}</table>`;
  } else if (v === "fleet") {
    const list = (sc.agents || []).slice().sort((a, b) => Number(b.usdc ?? 0) - Number(a.usdc ?? 0));
    if (!list.length && sc.tool !== "owner_fleet_list") { rerun("owner_fleet_list", { balances: true }); return; }
    const rows = list.map((a, i) => `<tr><td>${i + 1}</td><td><b>${esc(a.name)}</b> <span class="muted">${esc(a.role)}</span><br><span class="pill ${a.status === "active" ? "" : "bad"}">${esc(String(a.status).toUpperCase())}</span></td><td class="r">${a.usdc !== undefined ? esc(a.usdc) + " USDC" : "-"}</td><td class="r">$${esc(a.spentTodayUsd)} / $${esc(a.dailyLimitUsd)}</td><td class="r">${a.status === "active" ? `<button data-pause="${esc(a.name)}">Pause</button>` : a.status === "paused" ? `<button data-resume="${esc(a.name)}">Resume</button>` : ""}</td></tr>`).join("");
    root.innerHTML = `<div class="top"><span class="label">Fleet · ${esc(sc.active)} of ${esc(sc.total)} active</span><span class="pill ${sc.fleetPaused ? "bad" : ""}">${sc.fleetPaused ? "PAUSED" : "$" + esc(Number(sc.spentTodayUsd || 0).toFixed(2)) + " today"}</span></div>
      <table>${rows || "<tr><td class='muted'>no agents</td></tr>"}</table>
      <div class="actions"><button class="${sc.fleetPaused ? "" : "primary"}" id="all">${sc.fleetPaused ? "Resume all" : "Pause all"}</button><button id="refresh">Refresh balances</button></div><div id="msg"></div>`;
    document.getElementById("all").onclick = () => rerun(sc.fleetPaused ? "owner_fleet_resume" : "owner_fleet_pause", { target: "all" });
    document.getElementById("refresh").onclick = () => rerun("owner_fleet_list", { balances: true });
    root.querySelectorAll("[data-pause]").forEach((b) => (b.onclick = () => rerun("owner_fleet_pause", { target: b.dataset.pause })));
    root.querySelectorAll("[data-resume]").forEach((b) => (b.onclick = () => rerun("owner_fleet_resume", { target: b.dataset.resume })));
  } else if (v === "pending") {
    const rows = (sc.rows || []).map((o) => `<tr><td><b>${esc(o.summary)}</b><br><span class="muted">${esc((o.reasons || []).join("; "))}</span><div class="actions" style="margin-top:6px"><button class="primary" data-approve="${esc(o.id)}">Approve</button><button data-reject="${esc(o.id)}">Reject</button></div></td><td class="r">$${esc((o.usdValue || 0).toFixed(2))}</td></tr>`).join("");
    root.innerHTML = `<div class="top"><span class="label">Waiting for your approval</span><span class="pill ${(sc.rows || []).length ? "bad" : ""}">${(sc.rows || []).length}</span></div><table>${rows || "<tr><td class='muted'>nothing waiting</td></tr>"}</table><div id="msg"></div>`;
    root.querySelectorAll("[data-approve]").forEach((b) => (b.onclick = () => rerun("owner_approve", { orderId: b.dataset.approve })));
    root.querySelectorAll("[data-reject]").forEach((b) => (b.onclick = () => rerun("owner_reject", { orderId: b.dataset.reject })));
  }
  root.querySelectorAll("a[data-link]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); app.openLink({ url: a.href }).catch(() => {}); }));
}

function wireApproval(orderId) {
  const a = document.getElementById("approve"), r = document.getElementById("reject");
  if (a) a.onclick = () => rerun("owner_approve", { orderId });
  if (r) r.onclick = () => rerun("owner_reject", { orderId });
}

async function rerun(name, args) {
  const btns = root.querySelectorAll("button"); btns.forEach((b) => (b.disabled = true));
  const r = await call(name, args);
  if (r?.structuredContent) {
    const sc = r.structuredContent;
    render(sc.tool === "owner_approve" && sc.result ? { view: "send", ...sc.result } : sc.view === "fleet" && !sc.agents ? { view: "fleet", tool: "pending" } : sc);
    app.updateModelContext?.({ content: [{ type: "text", text: r.content?.[0]?.text ?? "Done from the card." }] }).catch(() => {});
  } else btns.forEach((b) => (b.disabled = false));
}

function say(t, bad) { const m = document.getElementById("msg"); if (m) m.innerHTML = `<span class="${bad ? "err" : "muted"}">${esc(t)}</span>`; }

async function call(name, args) {
  try {
    const r = await app.callServerTool({ name, arguments: args });
    if (r.isError) { say(r.content?.[0]?.text ?? "Failed.", true); return null; }
    return r;
  } catch (e) { say(e?.message ?? String(e), true); return null; }
}

app.ontoolresult = (p) => render(p.structuredContent);
app.onhostcontextchanged = (c) => { if (c.theme) document.documentElement.dataset.theme = c.theme; };
await app.connect();
const ctx = app.getHostContext(); if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme;
</script>
</body>
</html>
