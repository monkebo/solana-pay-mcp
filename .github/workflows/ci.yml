name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run gen:skill && git diff --exit-code -- skills || (echo "skill docs out of date: run npm run gen:skill" && exit 1)
      - run: SMOKE_HOME=$(mktemp -d) npm run smoke
