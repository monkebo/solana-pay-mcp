# saw vault on Fly.io. One small always-on machine, one volume for keys, policy and the ledger.
app = "usdcity-vault"
primary_region = "gru"

[build]

[env]
  SOLANA_CLUSTER = "devnet"
  SAW_HOME = "/data"
  SAW_PUBLIC_URL = "https://usdcity-vault.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "saw_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
